name: Integration (Full Kill Chain)

# Phase C4. This workflow spins up the entire compose stack and runs the
# kill chain end-to-end. It is gated on workflow_dispatch because:
#   * docker compose up takes 3-5 minutes on the GitHub runner
#   * ELK eats most of the runner's 7GB
# So it would dominate the PR feedback loop if it ran on every push.
#
# audit-4 G2d: this job is the lab's correctness gate -- it asserts the
# OUTPUT contracts that unit tests structurally can't reach, because the
# seam is the cross-container data flow:
#   1. Scoring works     -- scoreboard reports non-zero red + blue
#      detection scores after the kill chain (G1e).
#   2. Response works     -- an IR playbook lifts blue response_score (G1c).
#   3. Detections fire    -- every shipped Sigma rule has a live ingest
#      path: its campaign's syslog advisory reaches the syslog-* index,
#      and Suricata covers each network-visible technique (G2b/F1).
#
# Trigger manually from the GitHub Actions UI, or via:
#   gh workflow run integration.yml
on:
  workflow_dispatch:
  # Optional weekly safety net so dependency rot is caught even if no
  # one remembers to trigger it manually.
  schedule:
    - cron: "0 6 * * 1"   # Mondays at 06:00 UTC

jobs:
  killchain:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
        cache: pip

    - name: Install Python dependencies for the test harness
      # tests/integration/test_killchain.py imports runner.py from the
      # bare CI runner to walk TECHNIQUE_MAP for per-technique alert
      # assertions. That requires runner's top-level imports (click,
      # rich) to resolve outside the red-team container. Mirror the
      # install step in validate.yml so the test harness has the same
      # deps the unit suite already relies on.
      run: |
        python -m pip install --upgrade pip
        for req in red-team/requirements.txt blue-team/requirements.txt \
                   forensics/scoreboard/requirements.txt; do
          if [ -f "$req" ]; then pip install -r "$req"; fi
        done

    - name: Prepare .env (skip egress preflight, enable IR profile)
      run: |
        cp .env.example .env
        # audit-4 G3b: IR is opt-in by default now (.env.example ships
        # COMPOSE_PROFILES= empty). The integration suite needs the blue-team
        # IR container (test_response_score_rises_*) and the pki profile (the
        # G3a CA-bootstrap check below). Rewrite the line deterministically --
        # start.sh sources .env, so this must live in .env, not the job env.
        sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=ir,pki/' .env
        # d889e40 (2026-06-23) made the dashboards refuse to boot on the
        # committed .env.example placeholder secrets -- this step never
        # regenerated them, so every dispatch since has blue-team (and, once
        # #143 shipped, the scoreboard's award endpoint) crash-loop on the
        # exact denylisted default. Mirror scripts/lab/student-env.sh's
        # per-student secret generation here.
        for var in FLASK_SECRET_KEY PLAYBOOK_AUTH_TOKEN SCOREBOARD_AUTH_TOKEN; do
          sed -i "s/^${var}=.*/${var}=$(openssl rand -hex 32)/" .env
        done
        # The runner is on the public internet -- the preflight would
        # refuse to start. Air-gap is enforced via lab-net internal:true
        # at the network layer, which still applies.
        echo "AIB_SKIP_PREFLIGHT=1" >> "$GITHUB_ENV"

    - name: Build + start the lab
      run: bash scripts/lab/start.sh

    - name: Tail compose ps for diagnostics
      run: docker compose ps

    - name: Verify live containment (G3.2)
      # start.sh already runs this after its health poll (so a bad stack
      # never gets this far), but a dedicated named step gives it its own
      # pass/fail in the Actions UI instead of being buried in "Build +
      # start the lab"'s output.
      run: bash scripts/safety/containment_test.sh

    - name: Verify PKI profile serves TLS (audit-4 G3a)
      # Runs BEFORE the integration test, whose tearDownClass does
      # `docker compose down -v` and would otherwise nuke the stack first.
      # pki-init bootstraps the CA + stages the victim-web cert from a clean
      # checkout, so pki-nginx serves HTTPS instead of crash-looping. Curl it
      # from inside its own container (it has curl). Raw `docker` so lookup
      # doesn't depend on compose profile resolution.
      run: |
        echo "=== pki containers ==="; docker ps -a --filter name=pki --format '{{.Names}}\t{{.Status}}'
        NGINX=$(docker ps -a --filter name=pki-nginx --format '{{.Names}}' | head -1)
        INIT=$(docker ps -a --filter name=pki-init --format '{{.Names}}' | head -1)
        echo "=== pki-init log ($INIT) ===";  [ -n "$INIT" ]  && docker logs "$INIT"  2>&1 | tail -30 || echo "(no pki-init container)"
        echo "=== pki-nginx log ($NGINX) ==="; [ -n "$NGINX" ] && docker logs "$NGINX" 2>&1 | tail -30 || echo "(no pki-nginx container)"
        echo "=== staged certs ==="; ls -l pki-lab/certs/ || true
        if [ -z "$NGINX" ]; then echo "::error::no pki-nginx container exists"; exit 1; fi
        ok=
        for i in $(seq 1 12); do
          code=$(docker exec "$NGINX" curl -sk -o /dev/null -w '%{http_code}' https://localhost:443/ 2>/dev/null || true)
          echo "  attempt $i: HTTP [$code]  (state: $(docker inspect -f '{{.State.Status}}' "$NGINX" 2>/dev/null))"
          if [ -n "$code" ] && [ "$code" != "000" ]; then ok=1; break; fi
          sleep 5
        done
        if [ -z "$ok" ]; then
          echo "::error::pki-nginx did not serve TLS -- G3a cert bootstrap failed"
          exit 1
        fi
        echo "[pki] pki-nginx served a TLS response (G3a verified)"

    - name: Verify Kibana dashboard import (Phase E1)
      # Runs BEFORE the integration test (its tearDownClass does
      # `docker compose down -v`). Import every shipped dashboard NDJSON
      # into the live Kibana via the saved_objects API and assert success.
      # On the Linux runner Kibana's :5601 is published to localhost (same
      # as ES :9200 used by the tests). Proves the dashboards are valid,
      # importable saved objects against the running Kibana 8.13 -- not
      # just static JSON.
      run: |
        # Reach Kibana from inside a lab-net container (kibana:5601), the
        # same way the tests reach ES/scoreboard -- host :5601 isn't reliably
        # published on the runner. Copy each NDJSON into scoreboard (it has
        # curl) and POST it to the saved_objects API.
        for i in $(seq 1 18); do
          up=$(docker compose exec -T scoreboard curl -sm10 -o /dev/null -w '%{http_code}' http://kibana:5601/api/status 2>/dev/null || true)
          echo "kibana /api/status -> [$up]"; [ "$up" = "200" ] && break; sleep 5
        done
        fail=
        for f in siem/kibana/dashboards/*.ndjson; do
          base=$(basename "$f")
          echo "=== importing $base ==="
          docker compose cp "$f" scoreboard:/tmp/"$base"
          resp=$(docker compose exec -T scoreboard \
                   curl -s -X POST "http://kibana:5601/api/saved_objects/_import?overwrite=true" \
                     -H "kbn-xsrf: true" --form "file=@/tmp/${base};type=application/ndjson" || true)
          echo "$resp"
          echo "$resp" | grep -q '"success":true' \
            || { echo "::error::Kibana import failed for $base"; fail=1; }
        done
        if [ -n "$fail" ]; then exit 1; fi
        echo "[kibana] all dashboards imported successfully"

    - name: TEMP -- Phase G0.1 runtime confirmation evidence (#168)
      # Investigative-only, does not gate the job. Answers the four
      # environment-specific questions G0.1 gates later phases on. MUST run
      # here, before "Run integration test" -- that test's tearDownClass does
      # `docker compose down -v`, so Q2/Q3 (which need live containers)
      # previously came back "service not running" when this step ran after
      # it (see run 33291203166: Q1/Q4 answered, Q2/Q3 empty).
      # This step is removed again once findings/20260813-runtime-confirmation.md
      # is written from its output -- see docs/20260813-remediation-plan.md.
      if: always()
      run: |
        echo "::group::Q1 -- checksum-validation setting + invalid_checksum counters"
        echo "--- configured setting ---"
        grep -n "checksum-validation" blue-team/detection/suricata/suricata.yaml || true
        echo "--- stats.log (host-mounted /var/log/suricata, root-owned) ---"
        sudo grep -i "checksum" /var/log/suricata/stats.log 2>/dev/null | tail -10 \
          || echo "(no checksum counters found in stats.log)"
        echo "::endgroup::"

        echo "::group::Q2 -- container-to-gateway INPUT path (internal:true coverage)"
        # Two independent ad-hoc attempts at this (ip route: run 33291832912;
        # a hand-rolled /proc/net/route parse: run 33292272944) both came back
        # empty/inconclusive inside victim-web's minimal image. G3.2's
        # "Verify live containment" step above already answers this exact
        # question with a properly tested implementation
        # (scripts/safety/containment_test.sh, tests/test_containment_test_script.py)
        # -- see that step's own log output for the authoritative Q2 answer.
        echo "(see the 'Verify live containment (G3.2)' step's own output above)"
        echo "::endgroup::"

        echo "::group::Q3 -- Zeek _path field in zeek/zeek:7.0 notice.log"
        docker compose exec -T zeek sh -c "head -1 /var/log/zeek/notice.log 2>/dev/null || echo NO_NOTICE_LOG" || true
        echo "::endgroup::"

        echo "::group::Q4 -- find -exec bash -n exit-status propagation"
        mkdir -p /tmp/g01
        printf '#!/bin/bash\nif [ true\n' > /tmp/g01/broken.sh
        find /tmp/g01 -name '*.sh' -exec bash -n {} \; -exec echo "  [ok] {}" \;
        echo "find exit code: $?"
        echo "::endgroup::"

    - name: Run integration test
      env:
        AIB_RUN_INTEGRATION: "1"
        EVIDENCE_DIR: ${{ runner.temp }}/evidence
      run: |
        mkdir -p "$EVIDENCE_DIR"
        python -m unittest discover -s tests/integration -v

    - name: Dump compose logs on failure
      if: failure()
      run: docker compose logs --tail=200

    - name: Tear down
      if: always()
      run: docker compose down -v
