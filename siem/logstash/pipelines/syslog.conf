# syslog.conf — Logstash pipeline for syslog (auth, cron, sudo events)
#
# P9 (S4): ECS 8.x field convention -- see suricata.conf header. All ECS
# fields use Logstash nested syntax so core fields are named identically
# across the suricata-*/zeek-*/syslog-* indices.
#
# Note on [source][ip]: host-local process events (sudo, cron) have no
# network source by design, so they legitimately omit it. SSH auth failures
# DO carry a remote source, extracted below into [source][ip] -- so the field
# is named identically wherever it is present across all three indices.
input {
  syslog {
    port => 5514
    type => "syslog"
  }
}

filter {
  if [type] == "syslog" {
    # G1.3: stamp provenance BEFORE the grok below, from the transport-level
    # UDP sender address (`host`, set by the syslog input plugin itself) --
    # not from anything inside the message body, which a forger fully
    # controls. `[log][provenance]` marks every doc from this input as
    # untrusted-by-default; forensics/scoreboard/scorer.py's
    # _sigma_detection_ts() only trusts [observer][ingress][ip] matching the
    # real red-team container (ATTACKER_IP), so a lab-net peer forging a
    # syslog datagram with a rule's keywords can no longer be counted as a
    # detection.
    mutate {
      add_field => {
        "[observer][ingress][ip]" => "%{host}"
        "[log][provenance]" => "untrusted-syslog"
      }
    }

    # G1.5: the timestamp+hostname prefix is now optional. Campaign
    # advisories (BaseCampaign.emit_syslog_advisory(), a bare `logger(1)`
    # call) send "aib-<campaign>: message" with no RFC3164 prefix, which
    # never matched the previously-mandatory %{SYSLOGTIMESTAMP} %{HOSTNAME}
    # lead-in -- so [program] was never set and every `if [program] == ...`
    # conditional below silently never fired for them. Real host syslog
    # (which does carry the prefix) still matches the same way it always
    # did. Campaign-technique attribution for scoring purposes lives in
    # forensics/scoreboard/sigma_eval.py (reads the raw message directly),
    # not in these [program]-keyed conditionals -- they only drive ECS
    # tagging/categorization for operator-facing Kibana views.
    #
    # #238: SYSLOGTIMESTAMP and HOSTNAME are now two INDEPENDENT optional
    # groups, not one combined "(?:timestamp hostname )?" unit, and program
    # uses %{PROG} (word-ish chars only) instead of %{DATA} (lazy, can span
    # spaces). Docker's syslog logging driver -- what docker-compose.yml's
    # scoreboard service uses to ship its award-audit-trail log -- emits
    # "Aug 30 15:24:42 scoreboard[1737]: {json}" with NO hostname field at
    # all. Verified against the real driver's wire format (a UDP listener
    # capturing `docker run --log-driver=syslog`'s actual output) that the
    # combined-group + %{DATA} pattern let `program` swallow the whole
    # "Aug 30 15:24:42 scoreboard" prefix instead of stopping at
    # "scoreboard" -- there's no hostname token for the old pattern's
    # optional group to anchor on, so DATA's lazy match slid past the
    # timestamp looking for the next "prog[pid]: " it could find. Splitting
    # the groups and switching to PROG (which can't cross a space) fixes it
    # without changing behavior for the three other real message shapes
    # (real rsyslog with a hostname, `logger --rfc3164` with a hostname,
    # and G1.5's no-prefix-at-all campaign advisories) -- checked all four
    # against the fixed pattern.
    grok {
      match => { "message" => "(?:%{SYSLOGTIMESTAMP:syslog_timestamp} )?(?:%{HOSTNAME:[host][name]} )?%{PROG:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:syslog_message}" }
    }

    date {
      match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target => "@timestamp"
    }

    # G1.2: every syslog-* doc carries [event][dataset], same reason as
    # suricata.conf/zeek.conf.
    mutate {
      add_field => { "[event][dataset]" => "syslog" }
      add_field => { "[observer][type]" => "host" }
      add_field => { "[observer][name]" => "syslog" }
    }

    # Detect sudo events — T1548.003
    if [program] == "sudo" {
      mutate {
        add_tag => ["sudo_event", "T1548.003"]
        add_field => { "[event][category]" => "process" }
        add_field => { "[threat][technique][id]" => "T1548.003" }
        add_field => { "[threat][technique][name]" => "Sudo and Sudo Caching" }
      }
    }

    # Detect cron events — T1053.003
    if [program] =~ /cron/ {
      mutate {
        add_tag => ["cron_event", "T1053.003"]
        add_field => { "[event][category]" => "process" }
        add_field => { "[threat][technique][id]" => "T1053.003" }
      }
    }

    # Detect SSH auth failures — T1110
    if [program] == "sshd" and [syslog_message] =~ /Failed/ {
      # Pull the remote source IP out of the sshd message into ECS [source][ip].
      grok {
        match => { "syslog_message" => "from %{IP:[source][ip]}" }
        tag_on_failure => []
      }
      mutate {
        add_tag => ["ssh_auth_failure", "T1110"]
        add_field => { "[event][kind]" => "alert" }
        # ECS: an SSH auth failure is an authentication event. Without this the
        # sudo/cron blocks set [event][category] but this one did not, so SSH
        # brute-force alerts landed in ES with a null category and dropped out
        # of any category-filtered detection query or dashboard panel.
        add_field => { "[event][category]" => "authentication" }
        add_field => { "[threat][technique][id]" => "T1110" }
      }
    }

    # #238: the scoreboard service ships its whole stdout over this same
    # pipeline (docker-compose.yml's `logging: driver: syslog`), so
    # [program]=="scoreboard" covers every line it writes (Flask/werkzeug
    # request logs included), not just the G1.4 award audit-trail log
    # (app.py: `app.logger.info("award: %s %+d to %s from %s (detail=%r)", ...)`).
    # Narrow to the specific line shape rather than tagging every
    # scoreboard-tagged line as an award event. Verified against the real
    # `docker run --log-driver=syslog` wire format during development.
    if [program] == "scoreboard" and [syslog_message] =~ /award: / {
      grok {
        match => {
          "syslog_message" => "award: %{DATA:[scoreboard][award_event]} %{INT:[scoreboard][award_points]:int} to %{DATA:[scoreboard][team]} from %{IPORHOST:[source][ip]} "
        }
        tag_on_failure => []
      }
      mutate {
        add_tag => ["scoreboard_award"]
        add_field => { "[event][kind]" => "event" }
        add_field => { "[event][category]" => "iam" }
        add_field => { "[event][action]" => "score-adjustment" }
      }
    }
  }
}

output {
  if [type] == "syslog" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "syslog-%{+YYYY.MM.dd}"
    }
  }
}
